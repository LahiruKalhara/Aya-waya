<!doctype html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>අය වැය සහන</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #8a1c1c;
    --bg: #f4f1ea;
    --card: #ffffff;
    --text: #1f1f1f;
    --border: #d9d4c7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    font-family: 'Noto Sans Sinhala', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border-radius: 12px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, .08);
    overflow: hidden;
  }
  .card header {
    padding: 20px 24px;
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    font-size: 1.1rem;
    line-height: 1.7;
  }
  .note {
    margin: 0;
    padding: 14px 24px;
    background: #fff7e0;
    border-bottom: 1px solid #f0e2b6;
    color: #6b5200;
    font-size: .9rem;
    line-height: 1.8;
  }
  form { display: grid; gap: 16px; padding: 20px 24px 24px; }
  label { display: grid; gap: 6px; font-weight: 600; font-size: .95rem; }
  input, select {
    width: 100%;
    padding: 11px 12px;
    font: inherit;
    font-weight: 400;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    color: var(--text);
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    padding: 12px;
    font: inherit;
    font-size: 1rem;
    font-weight: 700;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button:disabled { opacity: .7; cursor: progress; }
  #result {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  #result[hidden] { display: none; }
  #result img { max-width: 100%; max-height: 100%; object-fit: contain; }
</style>
</head>
<body>

<div class="card" id="card">
  <header>අය වැය සහන දත්ත ලබාගැනීම සඳහා පහත සඳහන් තොරතුරු පුරවා Submit කරන්න</header>
  <p class="note">(මෙම දීමනාව එක් වරක් පමණක් හිමිවන බව කරුණාවෙන් සලකන්න. නැවත නැවත උත්සාහ කිරීම වෙනත් පුද්ගලයෙක් හට සිදුවන බාධාවක් බැවින්, නැවත නැවත උත්සාහ කිරීමෙන් වලකින්න)</p>

  <form id="form">
    <label>නම
      <input name="name" required maxlength="100" autocomplete="name">
    </label>

    <label>දුරකථන ජාලය (Dialog, Mobitel, Hutch etc)
      <select name="network" required>
        <option value="" disabled selected>තෝරන්න</option>
        <option>Dialog</option>
        <option>Mobitel</option>
        <option>Hutch</option>
        <option>Airtel</option>
        <option value="Other">වෙනත්</option>
      </select>
    </label>

    <label>දුරකථන අංකය
      <input name="phone" type="tel" inputmode="numeric" required maxlength="10"
             pattern="0?7[0-9]{8}" placeholder="07XXXXXXXX" title="උදා: 0771234567">
    </label>

    <button type="submit">Submit</button>
  </form>
</div>

<div id="result" hidden>
  <img src="gorilla.jpg" alt="">
</div>

<script>
  const form = document.getElementById('form');
  const button = form.querySelector('button');

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    button.disabled = true;
    button.textContent = 'යොමු කරමින්...';

    const data = new FormData(form);
    // Only name and network are sent. The phone number never leaves the browser.
    const payload = { name: data.get('name'), network: data.get('network') };

    const suspense = new Promise((resolve) => setTimeout(resolve, 1200));
    try {
      await fetch('/api/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
    } catch (err) {
      // Show the image even if saving fails.
    }
    await suspense;

    document.getElementById('card').hidden = true;
    document.getElementById('result').hidden = false;
  });
</script>
</body>
</html>
